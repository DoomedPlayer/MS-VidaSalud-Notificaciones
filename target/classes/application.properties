spring.application.name=vsNotificaciones
server.port=8080

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

rabbitmq.exchanges.direct=cmd.direct
rabbitmq.exchanges.topic=cmd.topic
rabbitmq.exchanges.dlx=cmd.dead.dlx

rabbitmq.queues.email=q.cmd.email
rabbitmq.queues.admission=q.cmd.admission
rabbitmq.queues.record=q.cmd.record

rabbitmq.queues.email-dlq=q.cmd.email.dlq
rabbitmq.queues.admission-dlq=q.cmd.admission.dlq
rabbitmq.queues.record-dlq=q.cmd.record.dlq

rabbitmq.routing.email-send=email.send
rabbitmq.routing.admission-ticket=admission.ticket
rabbitmq.routing.record-gen=record.gen
